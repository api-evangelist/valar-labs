aid: valar-labs
name: Valar Labs
description: >-
  Valar Labs is an AI oncology company building diagnostics that interpret solid
  tumors from routine pathology slides to predict cancer treatment response. Its
  proprietary CHAI (Computational Histology Artificial Intelligence) platform
  analyzes digitized H&E-stained slides — trained on 500,000+ pathologist
  annotations of tumors and their microenvironment — to help physicians and
  patients make evidence-based therapy decisions. Products include Vesta Bladder
  (predicting BCG response in non-muscle-invasive bladder cancer), Vesta Prostate,
  and Vitara Pancreas ChemoPredict (guiding first-line chemotherapy selection in
  advanced pancreatic cancer). Founded at the intersection of AI and oncology and
  backed by a16z and DCVC, Valar Labs delivers results within days without
  requiring additional tissue. The company operates a physician ordering portal at
  portal.valarlabs.com and publishes no public developer API, SDK, or
  machine-readable API specification as of this profile.
